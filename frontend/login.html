<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087443">
  <title>Regulator Login - VERIFY GH</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header class="header">
    <div class="container header__content">
      <a href="/index.html" class="header__logo">VERIFY GH</a>
    </div>
  </header>

  <main class="container" style="padding: 2rem 1rem;">
    <h1 style="text-align: center; margin-bottom: 2rem;">Regulator Login</h1>
    
    <form class="form" id="login-form">
      <div class="form__group">
        <label class="form__label" for="email">
          Email *
        </label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form__input" 
          placeholder="regulator@verifygh.demo"
          required
        >
      </div>

      <div class="form__group">
        <label class="form__label" for="password">
          Password *
        </label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form__input" 
          placeholder="••••••••"
          required
        >
      </div>

      <div id="error" class="form__error" style="display: none;"></div>

      <button type="submit" class="btn btn--primary" style="width: 100%;">
        Sign In
      </button>
    </form>

    <div id="loading" class="loading" style="display: none;">
      <div class="loading__spinner"></div>
      <p>Signing in...</p>
    </div>

    <div style="text-align: center; margin-top: 2rem;">
      <a href="/index.html" style="color: var(--primary); text-decoration: none;">Return to Home</a>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
